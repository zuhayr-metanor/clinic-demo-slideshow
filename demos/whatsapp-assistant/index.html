<style>
  /* Layout: mobile first. Package switch, then the patient's phone, then scenarios, the clinic side and finally the package checklist. Three columns on wide screens. */
  :root {

  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--mist); padding: 4px; border-radius: 13px; }
  .tab { position: relative; background: none; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; color: var(--petrol-800); display: grid; place-items: center; text-align: center; min-width: 0; }
  .tab b { font: 600 .9rem/1.2 var(--display); display: block; }

  .tab[aria-selected="true"] { background: var(--petrol-800); color: #fff; box-shadow: 0 6px 14px -8px rgba(8,46,35,.6); }
  .tier-line { font-size: 13.5px; color: var(--muted); }
  .tier-line b { color: var(--ink); font-weight: 600; }

  .layout { max-width: 1340px; margin-inline: auto; display: grid; gap: 14px; padding-block: 16px 8px; grid-template-areas: "phone" "controls" "clinic"; }
  .phone-col { grid-area: phone; min-width: 0; }
  .controls { grid-area: controls; }
  .clinic-wrap { grid-area: clinic; min-width: 0; display: grid; gap: 10px; }
  .column { display: grid; gap: 12px; min-width: 0; align-content: start; }
  .side-title { font: 600 1.05rem var(--display); color: var(--petrol-800); padding-inline: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: var(--petrol-800); }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--amber-ink); background: var(--amber-soft); border-radius: 5px; padding: 0 6px; margin-inline-start: 6px; }
  .explain { background: var(--coral-soft); border-color: #ecdcb2; }
  .explain h2 { color: var(--coral-deep); }

  .scen { display: flex; flex-wrap: wrap; gap: 7px; }
  .scen .group { flex-basis: 100%; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: 6px; }
  .scen .group:first-child { margin-top: 0; }
  .scen button { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #b9d9c7; color: #075e49; border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 500; min-height: 38px; text-align: start; }
  .scen button:hover { background: var(--ok-soft); }
  .scen button.locked { background: #f7faf6; color: var(--muted); border-style: dashed; border-color: var(--line); }
  .scen .lock { font-size: 11px; font-weight: 600; color: var(--coral-deep); background: var(--coral-soft); border-radius: 999px; padding: 1px 7px; }
  .reset { width: 100%; margin-top: 12px; background: transparent; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; color: var(--muted); font-size: 13.5px; }

  .phone { background: var(--wa-bg); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 36px -24px rgba(8,46,35,.6); border: 1px solid #d8d0c3; }
  .screen { display: flex; flex-direction: column; height: min(68svh, 640px); min-height: 440px; }
  .chat-head { background: var(--wa-head); color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .log { flex: 1; overflow-y: auto; padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
  .note { align-self: center; background: #fff7df; color: var(--amber-ink); font-size: 12px; padding: 3px 10px; border-radius: 8px; text-align: center; }
  .msg { max-width: 86%; padding: 7px 9px 4px; border-radius: 10px; box-shadow: 0 1px 1px rgba(0,0,0,.1); white-space: pre-line; overflow-wrap: anywhere; font-size: 14.5px; animation: pop .16s ease-out; }
  .msg.in { align-self: flex-start; background: #fff; border-start-start-radius: 2px; }
  .msg.out { align-self: flex-end; background: var(--wa-out); border-start-end-radius: 2px; }
  .msg.staff { border-inline-start: 3px solid var(--petrol-600); }
  .msg.urgent { background: #fbeaea; border-inline-start: 3px solid #a32a22; }
  .sender { display: block; font-size: 12px; font-weight: 600; color: var(--petrol-600); }
  .time { display: block; text-align: end; font-size: 10.5px; color: #667781; direction: ltr; }
  .ticket { background: var(--ok-soft); border-radius: 8px; padding: 7px 10px; margin-top: 6px; white-space: normal; }
  .ticket b { display: block; font-size: 20px; color: var(--ok); direction: ltr; text-align: start; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0; }
  .chips button { background: #fff; border: 1px solid #a9d3c3; color: #075e49; border-radius: 16px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; min-height: 36px; }

  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  .composer { display: flex; gap: 6px; padding: 8px; background: #f0f2ef; flex: none; }

  .composer button { flex: none; border: 0; border-radius: 20px; background: var(--wa-head); color: #fff; padding: 0 16px; font-weight: 600; }
  @keyframes pop { from { transform: translateY(4px); } }
  @keyframes blink { 50% { opacity: .3; } }

  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--page); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat b { display: block; font: 700 1.3rem var(--display); color: var(--petrol-800); font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
  .stat span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .queue, .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .queue li { background: var(--amber-soft); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; }
  .queue li.urgent { background: #fbeaea; }
  .queue li.done { background: var(--page); color: var(--muted); }
  .queue b { display: block; font-weight: 600; }
  .queue button { margin-top: 6px; background: var(--petrol-800); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-size: 13px; min-height: 34px; }
  .empty { color: var(--muted); font-size: 13.5px; }
  .feed li { font-size: 13px; padding-inline-start: 13px; position: relative; }
  .feed li::before { content: ""; position: absolute; inset-inline-start: 0; top: 8px; width: 6px; height: 6px; background: var(--petrol-600); border-radius: 50%; }
  .sched { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .sched th { text-align: start; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 6px 4px 0; }
  .sched td { border-top: 1px solid var(--line); padding: 6px 6px 6px 0; }
  .sched .t { direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sched tr.new td { background: var(--ok-soft); }
  .tscroll { overflow-x: auto; }
  .bars { display: grid; gap: 8px; }
  .bars .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; margin-bottom: 2px; }
  .bars .row b { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
  .track { height: 8px; background: var(--mist); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--petrol-600); border-radius: 4px; transition: width .3s; }
  .total { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; font-weight: 600; }
  .total b { font: 700 1.2rem var(--display); color: var(--ok); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }

  .compare-wrap { max-width: 1040px; margin-inline: auto; padding-block: 18px 34px; scroll-margin-top: 10px; }
  .compare-card { background: var(--panel); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 44px -34px rgba(8,46,35,.6); border: 1px solid var(--line); }
  .compare-head { padding: 20px 18px 6px; display: grid; gap: 6px; }
  .compare-head h2 { font: 700 clamp(1.35rem, 4.5vw, 1.9rem)/1.2 var(--display); color: var(--petrol-800); }
  .compare-head p { color: var(--muted); font-size: 14px; }
  .cmp { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13.5px; }
  .cmp col.feat { width: 40%; }
  .cmp thead th { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 14px 2px 12px; text-align: center; vertical-align: bottom; border-bottom: 1px solid var(--line); }

  .cmp thead button { margin-top: 8px; border: 1px solid var(--petrol-600); background: #fff; color: var(--petrol-800); border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 600; min-height: 32px; width: min(100%, 92px); }
  .cmp thead th.cur { background: var(--petrol-800); border-radius: 14px 14px 0 0; }
  .cmp thead th.cur b { color: #fff; }
  .cmp thead th.cur button { background: var(--gold); border-color: var(--gold); color: var(--petrol-900); }

  .cmp tr.grp td.cur { background: var(--petrol-800); }

  [dir="rtl"] .cmp tbody th[scope="row"] { padding: 9px 18px 9px 6px; }
  .cmp tbody th b { display: block; font-weight: 600; line-height: 1.35; }

  .cmp td { text-align: center; border-top: 1px solid var(--line); }
  .cmp td.cur { background: var(--petrol-800); border-top-color: rgba(255,255,255,.12); }
  .cmp .y { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 13px; }
  .cmp td.cur .y { background: var(--gold); color: var(--petrol-900); }
  .cmp .n { color: #a4b5aa; }
  .cmp td.cur .n { color: rgba(255,255,255,.35); }
  .cmp tbody tr:last-child td.cur { border-radius: 0 0 14px 14px; }
  .cmp-foot { padding: 14px 18px 18px; color: var(--muted); font-size: 12.5px; }

  @media (min-width: 640px) {
    .tab span { display: block; font-size: 12px; color: inherit; opacity: .75; margin-top: 2px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cmp { font-size: 14px; }
    .cmp thead b { font-size: 1.1rem; }

  @media (min-width: 1040px) {
    .layout { grid-template-columns: minmax(250px, 1fr) minmax(340px, 400px) minmax(280px, 1.15fr); grid-template-areas: "controls phone clinic"; align-items: start; gap: 18px; }
    .phone { background: #101a1d; border: 0; border-radius: 30px; padding: 9px; position: sticky; top: 10px; }
    .screen { border-radius: 22px; overflow: hidden; background: var(--wa-bg); height: min(700px, calc(100vh - 40px)); }

  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .msg, .typing i { animation: none; } .fill { transition: none; } }
</style>

<body>
<div class="banner gutter" id="banner"></div>

<header class="top gutter">
  <div class="top-inner">
    <h1 id="pageTitle"></h1>
    <div class="top-actions">
      <a id="siteLink" href="../../"></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ar">العربية</button>
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="bn">বাংলা</button>
      </div>
    </div>
  </div>
</header>

<main class="layout gutter">
  <section class="phone-col" aria-label="Patient chat">
    <div class="phone">
      <div class="screen">
        <header class="chat-head">
          <div class="avatar" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 40 40"><path d="M16 6h8v10h10v8H24v10h-8V24H6v-8h10z" fill="#0b3f30"/></svg></div>
          <div class="who"><b id="clinicName"></b><span id="clinicStatus"></span></div>
        </header>
        <div class="log" id="log" role="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <input id="input" autocomplete="off">
          <button type="submit" id="send"></button>
        </form>
      </div>
    </div>
  </section>

  <div class="column controls">
    <section class="panel pkg" aria-label="Package">
      <div class="pkg-label"><h2 id="pkgLabel"></h2><a href="#compare" id="seeCompare"></a></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <p class="tier-line" id="tierLine"></p>
    </section>
    <div class="panel">
      <h2 id="scenTitle"></h2>
      <p class="hint" id="scenHint"></p>
      <div class="scen" id="scen"></div>
      <button class="reset" id="reset" type="button"></button>
    </div>
    <div class="panel explain" aria-live="polite">
      <h2 id="explainTitle"></h2>
      <p id="explain"></p>
    </div>
  </div>

  <div class="clinic-wrap">
    <h2 class="side-title" id="clinicSide"></h2>
    <div class="column clinic" id="clinic" aria-label="Clinic view"></div>
  </div>
</main>

<section class="compare-wrap gutter" id="compare" aria-labelledby="compareTitle">
  <div class="compare-card">
    <div class="compare-head"><h2 id="compareTitle"></h2><p id="compareLead"></p></div>
    <div id="compareTable"></div>
    <p class="cmp-foot" id="compareFoot"></p>
  </div>
</section>

      await bot(x.ac2);
      const urgent = async () => { await bot(x.acUrgent, { urgent: true }); addQueue('aftercare', true); explain('aftercare'); };
      chips([[x.acGood, async () => { await bot(x.acGoodR); menu(); }], [x.acBleed, urgent], [x.acSwell, urgent]]);
    },

    async urgent() {
      const x = t();
      if (tier < 2) { await bot(x.handover); addQueue('pain', true); explain('handover'); menu(); return; }
      await bot(x.uQ); explain('urgent');
      chips([
        [x.uC[0], async () => {
          await bot(x.uSlot);
          chips(x.uSlots.map(s => [s, async () => { await bot(x.uBooked(s), { urgent: true }); schedule = [[s, '2', x.newPatient, x.uC[0], true], ...schedule]; addQueue('urgent', true); activity('urgent'); menu(); }]));
        }],
        [x.uC[1], async () => { await bot(x.uTooth, { urgent: true }); addQueue('urgent', true); menu(); }],
        [x.uC[2], async () => { await bot(x.uSwell, { urgent: true }); addQueue('urgent', true); menu(); }],
        [x.uC[3], flows.emergency]
      ]);
    },

    async followup() {
      const x = t();
      note(x.fuNote); m.followed = Math.min(m.followed + 1, m.quoted); activity('followup');
      await bot(x.fu); explain('followup');
      chips([
        [x.fuBook, async () => { m.booked = Math.min(m.booked + 1, m.followed); m.follow += 400; activity('fbooked'); await flows.book(x.treat[0]); }],
        [x.fuPay, async () => { await bot(x.fuPayR); addQueue('payment', false); menu(); }],
        [x.fuStaff, () => flows.handover('staff')],
        [x.stop, flows.optOut]
      ]);
    },

    async queue() {
      const x = t();
      note(x.qNote); activity('queue');
      token++;
      await bot(x.q, { ticket: 'A-' + token }); explain('queue');
      chips([[x.qGo, async () => { await bot(x.qGoR); menu(); }], [x.qLate, async () => { await bot(x.qLateR); addQueue('staff', false); menu(); }]]);
    },
    async results() {
      const x = t();
      note(x.resNote); activity('results');
      await bot(x.res); explain('results');
      chips([[x.resBook, () => flows.book(x.treat[0])], [x.resStaff, () => flows.handover('results', 'results')]]);
    },
    async employer() {
      const x = t();
      await bot(x.emQ); explain('employer');
      chips(x.emC.map(c => [c, async () => { await bot(x.emDone); addQueue('employer', false); activity('employer'); menu(); }]));
    },

    async form() {
      const x = t();
      note(x.formNote);
      await bot(x.form1); explain('form');
      const next = async () => {
        await bot(x.form2);
        const done = async () => { activity('form'); await bot(x.formDone); menu(); };
        chips([[x.noWord, done], [x.yesWord, done]]);
      };
      chips(x.formC.map(c => [c, next]));
    }
  };

  function detect(raw) {
    const s = ` ${raw.normalize('NFC').toLowerCase().trim().replace(/[?.,!؟،।]/g, ' ')} `;
    for (const [name, keys] of INTENTS) if (keys.some(k => s.includes(k.normalize('NFC')))) return name;
    return null;
  }
  function route(name) {
    if (name === 'greet') return async () => { await bot(t().welcome); menu(); };
    if (name && flows[name]) return flows[name];
    return async () => { await bot(t().unknown); addQueue('unknown', false); explain('unknown'); menu(); };
  }

  function runScenario(id) {
    clearChips();
    const say = t().say[id];
    if (say) patient(say);
    m.chats++;
    enqueue(flows[id]);
  }

  /* ---- rendering ---- */
  function renderTier() {
    const x = t(), cur = TIERS[tier - 1][lang];
    $('tabs').replaceChildren(...TIERS.map((c, i) => {
      const b = make('button', 'tab'); b.type = 'button';
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(i + 1 === tier));
      if (c.popular) b.append(make('em', 'pop', x.popular));
      b.append(make('b', '', c[lang].n), make('span', '', c[lang].s));
      b.onclick = () => setTier(i + 1);
      return b;
    }));
    const line = $('tierLine'); line.replaceChildren(make('b', '', cur.h + ' '), document.createTextNode(cur.b));
  }

  function renderScen() {
    const x = t(), box = $('scen'); box.replaceChildren();
    const open = SCEN.filter(s => s[1] <= tier), locked = SCEN.filter(s => s[1] > tier);
    box.append(make('div', 'group', x.included));
    open.forEach(([id]) => {
      const b = make('button', '', x.scen[id]); b.type = 'button'; b.dataset.s = id;
      b.onclick = () => runScenario(id);
      box.append(b);
    });
    if (locked.length) {
      box.append(make('div', 'group', x.lockedGroup));
      locked.forEach(([id, lv]) => {
        const b = make('button', 'locked'); b.type = 'button'; b.dataset.s = id;
        b.append(make('span', '', x.scen[id]), make('span', 'lock', TIERS[lv - 1][lang].n));
        b.onclick = () => { setTier(lv); runScenario(id); };
        box.append(b);
      });
    }
  }

  const fmt = n => n.toLocaleString('en-US');
  function panel(title, hint, sampleTag) {
    const p = make('div', 'panel'); const h = make('h2', '', title);
    if (sampleTag) h.append(make('span', 'tag', t().sample));
    p.append(h);
    if (hint) p.append(make('p', 'hint', hint));
    return p;
  }
  function statsGrid(keys) {
    const g = make('div', 'stats');
    keys.forEach(k => { const s = make('div', 'stat'); s.append(make('b', '', fmt(m[k])), make('span', '', t().s[k])); g.append(s); });
    return g;
  }
  function renderClinic() {
    const x = t(), box = $('clinic'), out = [];
    const q = panel(x.queue, x.queueHint);
    if (queue.length) {
      const ul = make('ul', 'queue');
      queue.forEach(item => {
        const li = make('li', (item.urgent ? 'urgent ' : '') + (item.done ? 'done' : ''));
        li.append(make('b', '', x.reasons[item.reason]));
        if (item.done) li.append(document.createTextNode(x.replied));
        else {
          const btn = make('button', '', x.reply); btn.type = 'button';
          btn.onclick = () => { item.done = true; renderClinic(); enqueue(async () => { bubble('in', x.staffHello, { staff: true }); explain('staff'); }); };
          li.append(btn);
        }
        ul.append(li);
      });
      q.append(ul);
    } else q.append(make('p', 'empty', x.queueEmpty));
    out.push(q);

    if (tier === 3) {
      const s = panel(x.schedPanel, null, true);
      const wrap = make('div', 'tscroll'), tb = make('table', 'sched');
      const hr = make('tr'); x.th.forEach(h => hr.append(make('th', '', h)));
      tb.append(hr);
      [...schedule].slice(0, 6).forEach(r => {
        const tr = make('tr', r[4] ? 'new' : '');
        const c0 = make('td', 't', r[0]); tr.append(c0, make('td', '', r[1]), make('td', '', r[2]), make('td', '', r[3]));
        tb.append(tr);
      });
      wrap.append(tb); s.append(wrap); out.push(s);

      const pipe = panel(x.pipePanel, null, true), bars = make('div', 'bars');
      [['quoted', m.quoted], ['followed', m.followed], ['booked', m.booked]].forEach(([k, v]) => {
        const w = make('div'), row = make('div', 'row');
        row.append(make('span', '', x.p[k]), make('b', '', fmt(v)));
        const tr = make('div', 'track'), fill = make('div', 'fill');
        fill.style.width = (v / m.quoted * 100) + '%';
        tr.append(fill); w.append(row, tr); bars.append(w);
      });
      pipe.append(bars); out.push(pipe);

      const rep = panel(x.reportPanel, null, true), rb = make('div', 'bars');
      const money = n => `${fmt(n)} ${x.sar}`;
      const nr = make('div', 'row'); nr.append(make('span', '', x.r.newp), make('b', '', fmt(m.newp))); rb.append(nr);
      ['noshow', 'recall', 'follow'].forEach(k => { const r = make('div', 'row'); r.append(make('span', '', x.r[k]), make('b', '', money(m[k]))); rb.append(r); });
      rep.append(rb);
      const tot = make('div', 'total'); tot.append(make('span', '', x.r.total), make('b', '', money(m.noshow + m.recall + m.follow)));
      rep.append(tot); out.push(rep);

      const camp = panel(x.campPanel, null, true), cb = make('div', 'bars');
      [86, 64, 31].forEach((v, i) => {
        const w = make('div'), row = make('div', 'row');
        row.append(make('span', '', x.camp[i]), make('b', '', fmt(v)));
        const tr = make('div', 'track'), fill = make('div', 'fill');
        fill.style.width = (v / 86 * 100) + '%';
        tr.append(fill); w.append(row, tr); cb.append(w);
      });
      camp.append(cb); out.push(camp);
    }
    if (tier >= 2) { const a = panel(x.autoPanel, null, true); a.append(statsGrid(['reminders', 'confirmed', 'slots', 'recalls', 'returned'])); out.push(a); }
    if (tier === 1 || tier === 2) { const a = panel(x.startPanel, null, true); a.append(statsGrid(['chats', 'bookings', 'quiz', 'reviews'])); out.push(a); }
    const f = panel(x.activity);
    if (feed.length) { const ul = make('ul', 'feed'); feed.forEach(i => ul.append(make('li', '', i))); f.append(ul); }
    else f.append(make('p', 'empty', '—'));
    out.push(f);
    box.replaceChildren(...out);
  }

  function renderCompare() {
    const x = t(), tb = make('table', 'cmp');
    const cg = make('colgroup'); cg.append(make('col', 'feat'), make('col'), make('col'), make('col')); tb.append(cg);
    const thead = make('thead'), hr = make('tr');
    hr.append(make('th', '', x.feature));
    TIERS.forEach((c, i) => {
      const th = make('th', i + 1 === tier ? 'cur' : ''); th.scope = 'col';
      th.append(make('b', '', c[lang].n));
      const btn = make('button', '', i + 1 === tier ? x.selected : x.tryIt); btn.type = 'button';
      btn.setAttribute('aria-pressed', String(i + 1 === tier));
      btn.onclick = () => { setTier(i + 1); document.querySelector('.phone-col').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }); };
      th.append(btn); hr.append(th);
    });
    thead.append(hr); tb.append(thead);
    const body = make('tbody');
    [1, 2, 3].forEach(level => {
      const g = make('tr', 'grp'), gh = make('th', '', x.groupTitle(TIERS[level - 1][lang].n)); gh.scope = 'rowgroup';
      g.append(gh); [1, 2, 3].forEach(i => g.append(make('td', i === tier ? 'cur' : ''))); body.append(g);
      FEATURES.filter(f => f[0] === level).forEach(f => {
        const tr = make('tr'), th = make('th'); th.scope = 'row';
        th.append(make('b', '', f[1][lang][0]), make('small', '', f[1][lang][1])); tr.append(th);
        [1, 2, 3].forEach(i => {
          const yes = f[0] <= i, td = make('td', i === tier ? 'cur' : '');
          const m = make('span', yes ? 'y' : 'n', yes ? '\u2713' : '\u2014');
          m.setAttribute('aria-label', yes ? 'yes' : 'no');
          td.append(m); tr.append(td);
        });
        body.append(tr);
      });
    });
    tb.append(body);
    $('compareTable').replaceChildren(tb);
    $('compareFoot').textContent = TIERS.map(c => `${c[lang].n}: ${c[lang].p}`).join(' \u00b7 ');
  }

  function renderStatic() {
    const x = t();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('banner').textContent = x.banner; $('pageTitle').textContent = x.title;
    $('siteLink').textContent = x.site; $('siteLink').href = '../../';
    $('scenTitle').textContent = x.scenTitle; $('scenHint').textContent = x.scenHint; $('reset').textContent = x.reset;
    $('explainTitle').textContent = x.explainTitle; $('clinicName').textContent = x.clinic; $('clinicStatus').textContent = x.status;
    $('send').textContent = x.send; $('input').placeholder = x.placeholder; $('input').setAttribute('aria-label', x.placeholder);
    $('compareTitle').textContent = x.compare; $('compareLead').textContent = x.cmpLead; $('pkgLabel').textContent = x.pkgLabel; $('seeCompare').textContent = x.seeCompare; $('clinicSide').textContent = x.clinicSide;
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }

  function restart() {
    session++; chain = Promise.resolve();
    log.replaceChildren();
    freshData();
    renderStatic(); renderTier(); renderScen(); renderCompare(); renderClinic();
    enqueue(flows.welcome);
  }
  function setTier(n) { tier = n; restart(); }

  document.querySelectorAll('.langs button').forEach(b => { b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('clinicSuiteLang', lang); } catch (e) {} restart(); }; });
  $('reset').onclick = restart;
  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('input').value.trim();
    if (!v) return;
    $('input').value = '';
    clearChips(); patient(v); m.chats++;
    enqueue(route(detect(v)));
  });

  restart();
})();
</script>
</body>
</html>
